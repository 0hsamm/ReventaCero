<section id="lineup" class="lineup" aria-labelledby="titulo-lineup">
  <header class="encabezado">
    <h2 id="titulo-lineup" class="titulo-seccion">
      Line<span class="contorno">up</span>
    </h2>
    <p>Tres noches y {{ artistas.length }} artistas confirmados.</p>
  </header>

  <ul class="grilla">
    @for (artista of artistas; track artista.nombre) {
      <li class="tarjeta" [class]="artista.tamano">
        <img [src]="artista.imagen" alt="" loading="lazy" />
        <div class="datos">
          <span class="dia">{{ artista.dia }}</span>
          <h3>{{ artista.nombre }}</h3>
        </div>
      </li>
    }
  </ul>
</section>
