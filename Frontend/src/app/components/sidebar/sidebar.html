<div class="sidebar no-imprimir">
  <a class="logo" routerLink="/">
    <span class="logo-marca" aria-hidden="true">R</span>
    ReventaCero
  </a>

  <p class="rol">Panel de {{ rol() }}</p>

  @if (esUsuario()) {
    <nav class="cambio-panel" aria-label="Cambiar de panel">
      <a
        routerLink="/app/usuario/boletas"
        [class.activa]="vista() === 'usuario'"
        [attr.aria-current]="vista() === 'usuario' ? 'true' : null"
      >
        Usuario
      </a>
      <a
        routerLink="/app/revendedor/boletas"
        [class.activa]="vista() === 'revendedor'"
        [attr.aria-current]="vista() === 'revendedor' ? 'true' : null"
      >
        Revendedor
      </a>
    </nav>
  }

  <nav class="menu" aria-label="Principal">
    @for (opcion of opciones(); track opcion.ruta) {
      <a
        class="menu-item"
        [routerLink]="opcion.ruta"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
      >
        <i class="pi" [class]="opcion.icono" aria-hidden="true"></i>
        {{ opcion.etiqueta }}
      </a>
    }
    <a
      class="menu-item"
      routerLink="/app/notificaciones"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
    >
      <i class="pi pi-bell" aria-hidden="true"></i>
      Notificaciones
      @if (totalNotificaciones() > 0) {
        <span class="contador">{{ totalNotificaciones() }}</span>
      }
    </a>
    <a class="menu-item" routerLink="/app/perfil" routerLinkActive="activo" ariaCurrentWhenActive="page">
      <i class="pi pi-user" aria-hidden="true"></i>
      Mi perfil
    </a>
    <a class="menu-item" routerLink="/eventos">
      <i class="pi pi-search" aria-hidden="true"></i>
      Ver festivales
    </a>
  </nav>

  <div class="pie">
    <button
      type="button"
      class="pie-accion"
      [attr.aria-label]="themeService.tema() === 'claro' ? 'Activar modo oscuro' : 'Activar modo claro'"
      (click)="themeService.alternar()"
    >
      <i
        class="pi"
        [class.pi-moon]="themeService.tema() === 'claro'"
        [class.pi-sun]="themeService.tema() === 'oscuro'"
        aria-hidden="true"
      ></i>
      <span>{{ themeService.tema() === 'claro' ? 'Modo oscuro' : 'Modo claro' }}</span>
    </button>

    <div class="perfil">
      <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
      <span class="perfil-nombre" [title]="nombreUsuario()">{{ nombreUsuario() }}</span>
      <button
        type="button"
        class="salir"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="confirmandoSalida.set(true)"
      >
        <i class="pi pi-sign-out" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

<app-confirm-dialog
  title="Cerrar sesión"
  message="Tu sesión se cerrará en este dispositivo."
  confirmLabel="Cerrar sesión"
  [visible]="confirmandoSalida()"
  (confirmed)="cerrarSesion()"
  (cancelled)="confirmandoSalida.set(false)"
></app-confirm-dialog>
