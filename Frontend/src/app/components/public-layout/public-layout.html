<header class="nav">
  <a class="logo" routerLink="/">Reventa<span>Cero</span></a>

  <nav aria-label="Principal">
    <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/eventos" routerLinkActive="activo">Festivales</a>
  </nav>

  <div class="acciones">
    <button
      type="button"
      class="tema"
      [attr.aria-label]="themeService.tema() === 'claro' ? 'Activar modo oscuro' : 'Activar modo claro'"
      (click)="themeService.alternar()"
    >
      <i
        class="pi"
        [class.pi-moon]="themeService.tema() === 'claro'"
        [class.pi-sun]="themeService.tema() === 'oscuro'"
        aria-hidden="true"
      ></i>
    </button>

    @if (logueado()) {
      <a class="btn btn-primary" [routerLink]="rutaPanel()">Mi panel</a>
    } @else {
      <a class="btn btn-ghost" routerLink="/acceso">Ingresar</a>
      <a class="btn btn-primary" routerLink="/registro">Registrarme</a>
    }
  </div>
</header>

<router-outlet></router-outlet>

<app-site-footer></app-site-footer>
