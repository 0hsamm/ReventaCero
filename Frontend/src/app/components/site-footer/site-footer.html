<footer class="footer">
  <p class="marca" aria-hidden="true">Reventa<span>Cero</span></p>

  <div class="columnas">
    <p class="nota">Boletas con código único y reventa con precio tope.</p>

    <nav aria-label="Plataforma">
      <h2>Plataforma</h2>
      <a routerLink="/eventos">Festivales</a>
      <a routerLink="/registro">Registrarme</a>
      <a routerLink="/acceso">Ingresar</a>
    </nav>

    <nav aria-label="Información legal">
      <h2>Legal</h2>
      @for (legal of legales; track legal.ruta) {
        <a [routerLink]="['/legal', legal.ruta]">{{ legal.etiqueta }}</a>
      }
    </nav>
  </div>

  <p class="derechos">© {{ anio }} ReventaCero</p>
</footer>
